<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseFit • Nutrition Activity Tracker</title>
  <!-- Google Fonts: Inter cho font chữ hiện đại, sắc nét -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header Thể thao & Công nghệ -->
    <header class="app-header">
      <div class="brand">
        <!-- Logo Fitness Pulse SVG chuyên nghiệp -->
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <div class="brand-info">
          <h1>PulseFit <span class="badge-pro">DEV</span></h1>
          <p>devopsminilab.site • Daily Nutrition Commit</p>
        </div>
      </div>
      
      <!-- Mục tiêu nhanh hiển thị dạng Pill -->
      <div class="targets-pill">
        <div class="target-badge">
          <span>Target Calo</span>
          <strong id="header-cal-goal">2000</strong> <small>kcal</small>
        </div>
        <div class="target-divider"></div>
        <div class="target-badge">
          <span>Target Protein</span>
          <strong id="header-pro-goal">120</strong> <small>g</small>
        </div>
      </div>
    </header>

    <!-- SECTION: BẢNG GITHUB ACTIVITY HEATMAP THEO NĂM -->
    <section class="card heatmap-card">
      <div class="card-header">
        <div class="card-title">
          <span class="activity-counter" id="total-days-logged">0 days logged in the last year</span>
        </div>
        <div class="heatmap-legend">
          <span>Less</span>
          <span class="cell-demo lvl-0"></span>
          <span class="cell-demo lvl-1"></span>
          <span class="cell-demo lvl-2"></span>
          <span class="cell-demo lvl-3"></span>
          <span class="cell-demo lvl-over"></span>
          <span>More</span>
        </div>
      </div>

      <!-- Khung chứa Grid: căn chỉnh co giãn vừa màn hình không thanh cuộn -->
      <div class="heatmap-container">
        <!-- Hàng hiển thị các tháng -->
        <div class="months-row" id="months-row"></div>
        
        <div class="heatmap-main">
          <!-- Cột thứ trong tuần (Mon, Wed, Fri) -->
          <div class="weekdays-col">
            <span></span>
            <span>Mon</span>
            <span></span>
            <span>Wed</span>
            <span></span>
            <span>Fri</span>
            <span></span>
          </div>
          <!-- Lưới 52 tuần x 7 ngày -->
          <div class="heatmap-grid" id="heatmap-grid"></div>
        </div>
      </div>
    </section>

    <!-- SECTION: TIẾN ĐỘ & BỮA ĂN CỦA NGÀY ĐANG CHỌN -->
    <div class="activity-divider">
      <div class="divider-left">
        <span class="dot-indicator"></span>
        <h2>Activity on <span id="viewing-date-label">Today</span></h2>
      </div>
      <button id="toggle-config-btn" class="btn-text">⚙️ Change Goals</button>
    </div>

    <!-- Khối ẩn/hiện cấu hình mục tiêu -->
    <div class="card config-drawer" id="config-drawer" style="display: none;">
      <div class="config-grid">
        <div>
          <label>Calorie Goal (kcal)</label>
          <input type="number" id="input-cal-goal" value="2000">
        </div>
        <div>
          <label>Protein Goal (g)</label>
          <input type="number" id="input-pro-goal" value="120">
        </div>
        <button id="save-goals-btn" class="btn btn-primary">Save Goals</button>
      </div>
    </div>

    <!-- Thanh tiến độ ngày đang chọn -->
    <section class="card progress-card">
      <div class="progress-item">
        <div class="progress-label">
          <span>Energy Intake</span>
          <strong><span id="day-cal-count">0</span> / <span id="day-cal-target">2000</span> kcal</strong>
        </div>
        <div class="progress-track">
          <div class="progress-fill cal-fill" id="cal-progress-bar"></div>
        </div>
      </div>

      <div class="progress-item">
        <div class="progress-label">
          <span>Protein</span>
          <strong><span id="day-pro-count">0</span> / <span id="day-pro-target">120</span> g</strong>
        </div>
        <div class="progress-track">
          <div class="progress-fill pro-fill" id="pro-progress-bar"></div>
        </div>
      </div>
    </section>

    <!-- Form Commit Bữa Ăn -->
    <section class="card form-card">
      <form id="meal-form">
        <div class="form-grid">
          <div class="input-group">
            <select id="meal-type">
              <option value="Breakfast"> Breakfast </option>
              <option value="Lunch"> Lunch </option>
              <option value="Dinner"> Dinner </option>
              <option value="Snack"> Snack </option>
            </select>
          </div>
          <div class="input-group span-2">
            <input type="text" id="meal-name" placeholder="Meal_name (e.g: 200g chicken...)" required>
          </div>
          <div class="input-group">
            <input type="number" id="meal-cal" placeholder="Kcal" min="0" required>
          </div>
          <div class="input-group">
            <input type="number" id="meal-pro" placeholder="Protein (g)" min="0" step="0.1" required>
          </div>
          <div class="input-group">
            <button type="submit" class="btn btn-emerald">Commit Meal</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Lịch sử món ăn trong ngày -->
    <section class="card list-card">
      <div class="list-header">
        <h3>Logged Meals</h3>
        <button id="reset-day-btn" class="btn-danger-text">Clear This Day</button>
      </div>
      <ul class="meal-list" id="meal-list"></ul>
    </section>
  </div>

  <!-- Tooltip động khi hover vào các ô -->
  <div id="grid-tooltip" class="grid-tooltip"></div>

  <script src="script.js"></script>
</body>
</html>
