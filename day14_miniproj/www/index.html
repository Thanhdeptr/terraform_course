<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition & Calorie Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <h1 class="brand-title">PULSE NUTRITION</h1>
        <p class="brand-sub">Daily Calorie & Protein Tracker | devopsminilab.site</p>
      </div>
      
      <div class="header-targets">
        <div class="target-item">
          <span class="target-label">Calorie Goal</span>
          <span class="target-val"><strong id="header-cal-goal">2000</strong> kcal</span>
        </div>
        <div class="target-divider"></div>
        <div class="target-item">
          <span class="target-label">Protein Goal</span>
          <span class="target-val"><strong id="header-pro-goal">120</strong> g</span>
        </div>
      </div>
    </header>

    <!-- SECTION: ANNUAL CONTRIBUTION HEATMAP -->
    <section class="card">
      <div class="card-header">
        <span class="card-title" id="total-days-logged">0 days logged this year</span>
        <div class="heatmap-legend">
          <span>Less</span>
          <span class="legend-cell lvl-0"></span>
          <span class="legend-cell lvl-1"></span>
          <span class="legend-cell lvl-2"></span>
          <span class="legend-cell lvl-3"></span>
          <span class="legend-cell lvl-over"></span>
          <span>More</span>
        </div>
      </div>

      <div class="heatmap-wrapper">
        <div class="months-row" id="months-row"></div>
        <div class="heatmap-body">
          <div class="weekdays-col">
            <span></span>
            <span>Mon</span>
            <span></span>
            <span>Wed</span>
            <span></span>
            <span>Fri</span>
            <span></span>
          </div>
          <div class="heatmap-grid" id="heatmap-grid"></div>
        </div>
      </div>
    </section>

    <!-- ACTIVE DAY OVERVIEW -->
    <div class="section-heading">
      <div class="heading-left">
        <span class="status-indicator"></span>
        <h2>Records for <span id="viewing-date-label">Today</span></h2>
      </div>
      <button id="toggle-goals-btn" class="btn-link">Edit Targets</button>
    </div>

    <!-- Hidden Goals Drawer -->
    <div class="card goals-drawer" id="goals-drawer" style="display: none;">
      <div class="goals-grid">
        <div class="form-group">
          <label>Target Calories (kcal)</label>
          <input type="number" id="input-cal-goal" value="2000" min="500">
        </div>
        <div class="form-group">
          <label>Target Protein (g)</label>
          <input type="number" id="input-pro-goal" value="120" min="10">
        </div>
        <button id="save-goals-btn" class="btn btn-primary">Save Targets</button>
      </div>
    </div>

    <!-- PROGRESS BARS -->
    <section class="card progress-card">
      <div class="progress-row">
        <div class="progress-info">
          <span>Calories</span>
          <strong><span id="day-cal-count">0</span> / <span id="day-cal-target">2000</span> kcal</strong>
        </div>
        <div class="progress-track">
          <div class="progress-fill fill-cal" id="cal-progress-bar"></div>
        </div>
      </div>

      <div class="progress-row">
        <div class="progress-info">
          <span>Protein</span>
          <strong><span id="day-pro-count">0</span> / <span id="day-pro-target">120</span> g</strong>
        </div>
        <div class="progress-track">
          <div class="progress-fill fill-pro" id="pro-progress-bar"></div>
        </div>
      </div>
    </section>

    <!-- ADD MEAL FORM -->
    <section class="card">
      <h3 class="card-subtitle">Log Meal</h3>
      <form id="meal-form">
        <div class="form-grid">
          <!-- CUSTOM DROPDOWN THAY THẾ CHO SELECT THƯỜNG -->
          <div class="form-group">
            <label>Meal Category</label>
            <div class="custom-select-wrapper" id="custom-meal-select">
              <input type="hidden" id="meal-type" value="Breakfast">
              <div class="custom-select-trigger">
                <span id="selected-meal-label">Breakfast</span>
                <span class="dropdown-chevron"></span>
              </div>
              <div class="custom-options">
                <div class="custom-option selected" data-value="Breakfast">Breakfast</div>
                <div class="custom-option" data-value="Lunch">Lunch</div>
                <div class="custom-option" data-value="Dinner">Dinner</div>
                <div class="custom-option" data-value="Snack">Snack</div>
              </div>
            </div>
          </div>

          <div class="form-group span-2">
            <label>Food Description</label>
            <input type="text" id="meal-name" placeholder="e.g. Grilled Chicken Salad" required>
          </div>
          <div class="form-group">
            <label>Calories (kcal)</label>
            <input type="number" id="meal-cal" placeholder="0" min="0" required>
          </div>
          <div class="form-group">
            <label>Protein (g)</label>
            <input type="number" id="meal-pro" placeholder="0" min="0" step="0.1" required>
          </div>
          <div class="form-group btn-align">
            <button type="submit" class="btn btn-primary">Add Entry</button>
          </div>
        </div>
      </form>
    </section>

    <!-- MEAL HISTORY LIST -->
    <section class="card">
      <div class="card-header">
        <h3 class="card-subtitle">Meal History</h3>
        <button id="reset-day-btn" class="btn-danger-link">Clear Day</button>
      </div>
      <ul class="meal-list" id="meal-list"></ul>
    </section>
  </div>

  <div id="grid-tooltip" class="grid-tooltip"></div>
  <script src="script.js"></script>
</body>
</html>
